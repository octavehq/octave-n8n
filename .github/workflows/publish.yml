name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # --ignore-scripts skips native gyp builds for transitive deps of
        # n8n-workflow (e.g. isolated-vm) that we never execute during
        # build/lint/publish. We only need the TypeScript declarations.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint (prepublish config)
        run: npx eslint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
