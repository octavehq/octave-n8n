version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # n8n-workflow >=2.30.0 depends on @n8n/utils, which pins an old
      # nanoid with open advisories and offers no resolvable upgrade
      # path (and n8n verification disallows package.json overrides for
      # community nodes). Staying on the 2.29.x line, which ships
      # patched uuid/form-data, until @n8n/utils moves its nanoid pin.
      - dependency-name: "n8n-workflow"
        versions: [">=2.30.0"]
